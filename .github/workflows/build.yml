name: Build

on:
  push:
    branches: [ master, features/** ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # MAUI Android compila igual en Linux que en Windows y no necesita nada específico de
    # escritorio (a diferencia de VideoGameLibrary, que es WPF y solo compila en windows-latest).
    runs-on: ubuntu-latest

    # GameRepositoryTests necesita un PostgreSQL real en localhost:5432 (ver comentario en
    # Tests/GameRepositoryTests.cs) -- a diferencia de VideoGameLibrary (windows-latest, que ya
    # trae Postgres preinstalado y hay que reconfigurar a mano), en ubuntu-latest lo más simple
    # es este contenedor de servicio nativo de Actions en vez de instalar/arrancar nada.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: Admin123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Crear SupabaseConfig.cs de prueba
        # Infrastructure/Accounts/SupabaseConfig.cs está en .gitignore a propósito (ver README) --
        # en un checkout limpio de CI no existe, y el proyecto no compila sin él. No hace falta que
        # las claves sean reales para verificar que el código compila, así que basta con copiar la
        # plantilla .example tal cual.
        run: cp Infrastructure/Accounts/SupabaseConfig.cs.example Infrastructure/Accounts/SupabaseConfig.cs

      - name: Restaurar dependencias (solución completa)
        run: dotnet restore VideoGameLibraryAndroid.sln

      - name: Verificar formato (.editorconfig)
        run: dotnet format VideoGameLibraryAndroid.sln --verify-no-changes --no-restore

      - name: Ejecutar tests (Core, sin necesitar Android)
        run: dotnet test Tests/VideoGameLibraryAndroid.Tests.csproj -c Release --no-restore

      - name: Compilar la app (Release, net9.0-android)
        # Sin ANDROID_RELEASE_* configurado como secreto en este repo, las propiedades de firma
        # del .csproj quedan vacías y el build cae solo en el debug.keystore del SDK -- válido
        # para verificar que compila, no para publicar un APK de verdad (eso se sigue haciendo
        # a mano en local, con la clave real).
        run: dotnet build VideoGameLibraryAndroid.csproj -c Release -f net9.0-android --no-restore
